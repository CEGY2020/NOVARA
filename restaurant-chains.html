<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurant Chains · Optima ProLink</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="novara-ui-standard.css">
  <style>
    body{font-family:Arial,sans-serif;color:#000}
    .chain-page{max-width:1200px;margin:0 auto;padding:18px}
    .chain-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
    .chain-toolbar label,.chain-form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12pt;color:#000}
    .chain-toolbar input,.chain-form input,.chain-form select,.chain-form textarea{font:12pt Arial,sans-serif;color:#000;border:1px solid #7f8c99;border-radius:5px;background:#fff;padding:5px 8px;box-sizing:border-box}
    .chain-toolbar input,.chain-form input,.chain-form select{height:32px}
    .chain-form textarea{min-height:58px}
    .chain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .wide{grid-column:1/-1}
    .section-card{border:1px solid #c7d3dc;border-radius:8px;padding:14px;margin-top:14px;background:#fff}
    .section-card h3{margin:0 0 10px;font-size:16pt}
    .record{border-top:1px solid #d9e1e7;padding-top:10px;margin-top:10px}
    .record:first-of-type{border-top:0;padding-top:0;margin-top:0}
    .record-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    button,.link-btn{font:700 11pt Arial,sans-serif;padding:6px 10px;border:1px solid #7f8c99;border-radius:5px;background:#fff;color:#000;cursor:pointer;text-decoration:none;display:inline-block}
    .primary{background:#d9edf9;border-color:#4aa3df}
    .list{width:100%;border-collapse:collapse;margin-top:10px}
    .list th,.list td{padding:8px;border-bottom:1px solid #d9e1e7;text-align:left;font-size:11pt}
    .list th{background:#eef5f9}
    .required{color:#c62828;font-weight:700}
    #status{font-weight:700;margin-left:6px}
    @media(max-width:800px){.chain-grid{grid-template-columns:1fr}}
  </style>
</head>
<body data-page="restaurant-chains" data-role="aem">
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar-root"></aside>
    <main class="main-content">
      <header class="topbar"><div><h2>Restaurant Chains</h2><p>Enter each restaurant chain once, then link individual restaurant sites to it.</p></div><div id="user-profile-root"></div></header>
      <div class="chain-page">
        <section class="section-card">
          <div class="chain-toolbar">
            <label>Find Chain<input id="chain-search" type="search" placeholder="Start typing chain name"></label>
            <button id="new-chain" type="button" class="primary">+ New Chain</button>
            <a class="link-btn" href="restaurant-workspace.html?application=RHW&portal=aem">Restaurant Workspace</a>
          </div>
          <table class="list"><thead><tr><th>Chain</th><th>Chain ID</th><th>Main Office</th><th>Phone</th><th>Other Offices</th><th>Contacts</th><th></th></tr></thead><tbody id="chain-list"></tbody></table>
        </section>

        <section class="section-card" id="editor">
          <h3>Chain Information</h3>
          <form id="chain-form" class="chain-form">
            <div class="chain-grid">
              <label>Restaurant Chain Name <span class="required">*</span><input id="chain-name" required></label>
              <label>Chain ID<input id="chain-id" readonly placeholder="Generated by AEM"></label>
              <label>Website<input id="website" type="url"></label>
              <label>Main Office Address <span class="required">*</span><input id="main-address" required></label>
              <label>City <span class="required">*</span><input id="main-city" required></label>
              <label>State <span class="required">*</span><input id="main-state" required></label>
              <label>ZIP <span class="required">*</span><input id="main-zip" required></label>
              <label>Main Office Phone<input id="main-phone" type="tel"></label>
              <label>Main Office Email<input id="main-email" type="email"></label>
              <label class="wide">Notes<textarea id="notes"></textarea></label>
            </div>

            <div class="section-card">
              <div class="record-head"><h3>Other Offices</h3><button id="add-office" type="button">+ Add Office</button></div>
              <div id="offices"></div>
            </div>

            <div class="section-card">
              <div class="record-head"><h3>Corporate Contacts</h3><button id="add-contact" type="button">+ Add Contact</button></div>
              <div id="contacts"></div>
            </div>

            <div style="display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap">
              <button type="submit" class="primary">Save Chain</button>
              <button id="delete-chain" type="button">Delete Chain</button>
              <span id="status" role="status"></span>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <script src="auth.js"></script><script src="role.js"></script><script src="nav.js?v=restaurant-chains1"></script><script src="maps-config.js?v=20261011-chainlookup1"></script><script src="restaurant-chains.js?v=20261011-2"></script><script src="restaurant-chain-online-lookup.js?v=20261011-online2"></script>
</body>
</html>
