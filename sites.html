<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Sites</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ecf0f1;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 20px 30px;
      font-size: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #1b4f7c;
      color: white;
      padding: 15px;
      text-align: left;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #e5e5e5;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      background: #1976d2;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logout-btn {
      padding: 6px 14px;
      background-color: #e74c3c;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <header>
    <h1><strong>NOVARA Sites</strong></h1>
    <div class="header-actions">
      <a href="dashboard.html" class="back-btn">← Dashboard</a>
      <a href="index.html" class="logout-btn">Logout</a>
    </div>
  </header>

  <div class="container">
    <table>
      <tr>
        <th>Site Name</th>
        <th>Location</th>
        <th>Systems</th>
        <th>Status</th>
      </tr>
      <tr>
        <td>Vista Springs</td>
        <td>Huntington Beach, CA</td>
        <td>3</td>
        <td>Online</td>
      </tr>
      <tr>
        <td>Highlander Pointe</td>
        <td>Irvine, CA</td>
        <td>2</td>
        <td>Online</td>
      </tr>
      <tr>
        <td>La Verne Pool</td>
        <td>La Verne, CA</td>
        <td>1</td>
        <td>Needs Review</td>
      </tr>
    </table>
  </div>
</body
