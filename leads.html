<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Leads</title>
  <link rel="stylesheet" href="dashboard.css?v=leads-followup-1">
</head>
<body data-page="leads">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Leads</h2>
        <p>Sales pipeline and follow-ups</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="primary-btn" id="add-lead-btn" aria-haspopup="dialog">
          + Add Lead
        </button>
        <div id="user-profile-root"></div>
      </div>
    </header>

    <div class="view-tabs" role="tablist" aria-label="Leads views">
      <button type="button" class="view-tab is-active" role="tab" id="tab-list" data-view="list" aria-selected="true" aria-controls="leads-list-view">
        List
      </button>
      <button type="button" class="view-tab" role="tab" id="tab-pipeline" data-view="pipeline" aria-selected="false" aria-controls="leads-pipeline-view">
        Pipeline
      </button>
    </div>

    <div class="leads-toolbar">
      <label class="filter-field">
        <span>Stage</span>
        <select id="filter-stage" aria-label="Filter by stage">
          <option value="">All stages</option>
          <option value="New Lead">New Lead</option>
          <option value="Contacted">Contacted</option>
          <option value="Qualified">Qualified</option>
          <option value="Proposal Sent">Proposal Sent</option>
          <option value="Won">Won</option>
          <option value="Lost">Lost</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Assigned To</span>
        <select id="filter-assigned" aria-label="Filter by assigned to">
          <option value="">Anyone</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Follow-up</span>
        <select id="filter-followup" aria-label="Filter by follow-up status">
          <option value="">All follow-ups</option>
          <option value="needs">Needs Follow-up</option>
          <option value="overdue">Overdue</option>
          <option value="due-soon">Due Soon (7 days)</option>
          <option value="none">No date set</option>
        </select>
      </label>
      <p id="leads-status" class="chart-status" aria-live="polite">Loading leads…</p>
    </div>

    <div id="leads-list-view" class="leads-view" role="tabpanel" aria-labelledby="tab-list">
      <table class="data-table">
        <thead>
          <tr>
            <th>Lead ID</th>
            <th>Company / Site</th>
            <th>Contact</th>
            <th>Stage</th>
            <th>Next Follow-up</th>
            <th>Assigned To</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="leads-tbody">
          <tr>
            <td colspan="8">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="leads-pipeline-view" class="leads-view" role="tabpanel" aria-labelledby="tab-pipeline" hidden>
      <div id="pipeline-board" class="pipeline-board" aria-live="polite">
        <p class="pipeline-empty">Loading pipeline…</p>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="lead-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title">
    <div class="modal-header">
      <div>
        <h3 id="lead-modal-title">Add Lead</h3>
        <p id="lead-modal-subtitle">Create a new lead in NOVARALeads</p>
      </div>
      <button type="button" class="modal-close" id="lead-modal-close" aria-label="Close">&times;</button>
    </div>

    <form id="lead-form" class="site-form" novalidate>
      <input type="hidden" id="lead-mode" value="create">

      <div class="form-grid">
        <label class="form-field">
          <span>LeadID <em>*</em></span>
          <input type="text" id="field-leadId" name="LeadID" required maxlength="64" autocomplete="off" readonly aria-readonly="true">
          <small class="field-hint" id="lead-id-hint">Auto-generated sequentially (LD001…)</small>
        </label>
        <label class="form-field">
          <span>CompanyName / SiteName <em>*</em></span>
          <input type="text" id="field-companyName" name="CompanyName" required maxlength="160" autocomplete="organization">
        </label>
        <label class="form-field">
          <span>ContactName</span>
          <input type="text" id="field-contactName" name="ContactName" maxlength="120" autocomplete="name">
        </label>
        <label class="form-field">
          <span>ContactEmail</span>
          <input type="email" id="field-contactEmail" name="ContactEmail" maxlength="160" autocomplete="email">
        </label>
        <label class="form-field">
          <span>ContactPhone</span>
          <input type="tel" id="field-contactPhone" name="ContactPhone" maxlength="40" autocomplete="tel">
        </label>
        <label class="form-field">
          <span>Source</span>
          <select id="field-source" name="Source">
            <option value="">Select…</option>
            <option value="Referral">Referral</option>
            <option value="Website">Website</option>
            <option value="Rinnai">Rinnai</option>
            <option value="Trade Show">Trade Show</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label class="form-field">
          <span>SystemType</span>
          <select id="field-systemType" name="SystemType">
            <option value="">Select…</option>
            <option value="DHW">DHW</option>
            <option value="Pool">Pool</option>
            <option value="HVAC">HVAC</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label class="form-field">
          <span>Stage</span>
          <select id="field-stage" name="Stage">
            <option value="New Lead">New Lead</option>
            <option value="Contacted">Contacted</option>
            <option value="Qualified">Qualified</option>
            <option value="Proposal Sent">Proposal Sent</option>
            <option value="Won">Won</option>
            <option value="Lost">Lost</option>
          </select>
        </label>
        <label class="form-field form-field-followup">
          <span>Next Follow-up</span>
          <input type="date" id="field-nextFollowUp" name="NextFollowUp">
          <small class="field-hint">Set or clear the next outreach date. Overdue and dates within 7 days are highlighted in the list and pipeline.</small>
        </label>
        <label class="form-field">
          <span>Assigned To</span>
          <input type="text" id="field-assignedTo" name="AssignedTo" maxlength="120" autocomplete="off">
        </label>
        <label class="form-field">
          <span>Estimated Savings</span>
          <input type="number" id="field-estimatedSavings" name="EstimatedSavings" min="0" step="any" placeholder="Optional">
        </label>
        <p id="lead-last-updated" class="lead-last-updated" hidden></p>
        <label class="form-field form-field-wide">
          <span>Notes</span>
          <textarea id="field-notes" name="Notes" rows="3" maxlength="2000" placeholder="Optional notes"></textarea>
        </label>
      </div>

      <p id="lead-form-error" class="form-error" role="alert" hidden></p>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="lead-cancel-btn">Cancel</button>
        <button type="submit" class="primary-btn" id="lead-save-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="api-config.js?v=leads-followup-1"></script>
<script src="api-client.js?v=leads-followup-1"></script>
<script src="role.js?v=leads-followup-1"></script>
<script src="nav.js?v=leads-followup-1"></script>
<script src="leads.js?v=leads-followup-1"></script>
</body>
</html>
