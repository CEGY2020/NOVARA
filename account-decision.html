<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Account decision</title>
  <link rel="stylesheet" href="style.css?v=account-decision-1">
  <style>
    .decision-meta {
      margin: 0 0 18px;
      color: #4a5d6a;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
    }
    .decision-meta strong {
      color: #163f63;
    }
    .decision-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .decision-actions .sign-in-button {
      width: auto;
      min-width: 120px;
      padding: 0 18px;
    }
    .decision-actions .sign-in-button.danger {
      background: #b42318;
    }
    .decision-actions .sign-in-button.danger:hover {
      background: #912018;
    }
    #reasonField {
      display: none;
      margin-top: 14px;
      text-align: left;
    }
    #reasonField.is-visible {
      display: block;
    }
    #reasonField textarea {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      border: 1px solid #c4ced6;
      border-radius: 7px;
      font: inherit;
      resize: vertical;
      margin-top: 7px;
    }
    .send-email-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: #4a5d6a;
      font-weight: 400;
    }
    .decision-footer {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
    }
    .decision-footer a {
      color: #1596ae;
      text-decoration: none;
    }
    .decision-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <img src="images/novara-logo.png" alt="NOVARA" class="logo">
    <h2 id="decisionTitle" class="subtitle" style="color:#163f63;font-weight:700">Account decision</h2>
    <p class="decision-meta" id="decisionMeta">Loading decision details…</p>
    <p id="decisionMessage" class="login-message" aria-live="polite"></p>

    <div id="reasonField">
      <label for="rejectReason">Rejection reason</label>
      <textarea id="rejectReason" maxlength="500" placeholder="Explain why this account is being rejected"></textarea>
      <label class="send-email-row">
        <input type="checkbox" id="sendRejectionEmail" checked>
        <span>Send a polite rejection email that includes this reason</span>
      </label>
    </div>

    <div class="decision-actions" id="decisionActions" hidden>
      <button type="button" class="sign-in-button" id="approveBtn">Approve</button>
      <button type="button" class="sign-in-button danger" id="rejectBtn">Reject</button>
      <button type="button" class="sign-in-button danger" id="confirmRejectBtn" hidden>Confirm reject</button>
    </div>

    <p class="decision-footer">
      <a href="users.html" id="usersAdminLink">Open Users admin</a>
    </p>
  </section>
</main>

<script src="api-config.js"></script>
<script src="api-client.js"></script>
<script src="account-decision.js"></script>
</body>
</html>
