<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA | Video Landing Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body class="landing-page video-landing">

<main class="hero" id="top" aria-label="NOVARA video landing reference">
  <div class="hero-media" aria-hidden="true">
    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="images/wave-video.mp4" type="video/mp4">
    </video>
    <div class="hero-veil hero-veil-light"></div>
  </div>

  <div class="hero-content">
    <img
      class="hero-brand-logo"
      src="images/novara-logo-hero.png"
      alt="NOVARA"
    >
    <div class="hero-ctas">
      <a class="btn btn-primary" href="directory.html">GET STARTED</a>
      <a class="btn btn-ghost" href="login.html">LOG IN</a>
    </div>
  </div>
</main>

</body>
</html>
