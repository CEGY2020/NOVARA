<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Systems</title>
  <link rel="stylesheet" href="dashboard.css?v=systems-form-2">
</head>
<body data-page="systems">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Systems</h2>
        <p>Monitored building systems</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="primary-btn" id="add-system-btn" aria-haspopup="dialog">
          + Add System
        </button>
        <div id="user-profile-root"></div>
      </div>
    </header>

    <p id="systems-status" class="chart-status" aria-live="polite">Loading systems…</p>

    <table class="data-table">
      <thead>
        <tr>
          <th>System ID</th>
          <th>Site</th>
          <th>Site ID</th>
          <th>System Name</th>
          <th>System Type</th>
          <th>Status</th>
          <th>Equipment</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="systems-tbody">
        <tr>
          <td colspan="8">Loading…</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<div class="modal-backdrop" id="system-modal" hidden>
  <div class="modal-panel modal-panel-wide" role="dialog" aria-modal="true" aria-labelledby="system-modal-title">
    <div class="modal-header">
      <div>
        <h3 id="system-modal-title">Add System</h3>
        <p id="system-modal-subtitle">Create a new system in NOVARASystems</p>
      </div>
      <button type="button" class="modal-close" id="system-modal-close" aria-label="Close">&times;</button>
    </div>

    <form id="system-form" class="site-form" novalidate>
      <input type="hidden" id="system-mode" value="create">

      <div class="form-grid">
        <label class="form-field">
          <span>SystemID <em>*</em></span>
          <input type="text" id="field-systemId" name="SystemID" required maxlength="64" autocomplete="off" readonly aria-readonly="true">
          <small class="field-hint" id="system-id-hint">Auto-generated sequentially (SYS001…)</small>
        </label>
        <label class="form-field">
          <span>SystemName <em>*</em></span>
          <input type="text" id="field-systemName" name="SystemName" required maxlength="120" autocomplete="off">
        </label>
        <label class="form-field">
          <span>Site <em>*</em></span>
          <select id="field-siteId" name="SiteID" required>
            <option value="">Select site…</option>
          </select>
        </label>
        <label class="form-field">
          <span>SiteID</span>
          <input type="text" id="field-siteIdDisplay" readonly aria-readonly="true">
        </label>
        <label class="form-field">
          <span>SystemType <em>*</em></span>
          <select id="field-systemType" name="SystemType" required>
            <option value="">Select…</option>
            <option value="DHW NG">DHW NG</option>
            <option value="DHW kW">DHW kW</option>
            <option value="DHW LP">DHW LP</option>
            <option value="Pool">Pool</option>
            <option value="HVAC">HVAC</option>
            <option value="Boiler">Boiler</option>
          </select>
        </label>
        <label class="form-field">
          <span>Status</span>
          <select id="field-status" name="Status">
            <option value="Online">Online</option>
            <option value="Offline">Offline</option>
            <option value="Needs Review">Needs Review</option>
            <option value="Maintenance">Maintenance</option>
          </select>
        </label>
        <label class="form-field">
          <span>EquipmentCount</span>
          <input type="number" id="field-equipmentCount" name="EquipmentCount" min="0" step="1" value="0">
        </label>
        <label class="form-field">
          <span>InstallDate</span>
          <input type="date" id="field-installDate" name="InstallDate">
        </label>
        <label class="form-field form-field-wide">
          <span>Notes</span>
          <textarea id="field-notes" name="Notes" rows="3" maxlength="2000" placeholder="Optional notes"></textarea>
        </label>
      </div>

      <section class="photos-section" id="photo-section" aria-label="System photos">
        <div class="photos-section-header">
          <div>
            <h4>Photos</h4>
            <p>Linked to this system and its parent site</p>
          </div>
        </div>
        <p id="photo-status" class="photo-status" role="status" hidden></p>
        <p id="photo-empty" class="photo-empty">Save this system first to attach photos.</p>
        <div id="photo-gallery" class="photo-gallery" aria-live="polite"></div>
        <div class="photo-upload-grid">
          <label class="form-field">
            <span>PhotoType</span>
            <select id="photo-type">
              <option value="System" selected>System</option>
              <option value="Equipment">Equipment</option>
              <option value="Nameplate">Nameplate</option>
              <option value="Property">Property</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label class="form-field">
            <span>Caption</span>
            <input type="text" id="photo-caption" maxlength="500" placeholder="Optional caption">
          </label>
          <label class="form-field form-field-wide">
            <span>Images</span>
            <input type="file" id="photo-files" accept="image/*" multiple>
          </label>
          <div class="photo-upload-actions form-field-wide">
            <button type="button" class="secondary-btn" id="photo-upload-btn">Upload photos</button>
          </div>
        </div>
      </section>

      <p id="system-form-error" class="form-error" role="alert" hidden></p>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="system-cancel-btn">Cancel</button>
        <button type="submit" class="primary-btn" id="system-save-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="photo-lightbox" id="photo-lightbox" hidden>
  <div class="photo-lightbox-panel" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button type="button" class="photo-lightbox-close" id="photo-lightbox-close" aria-label="Close">&times;</button>
    <img id="photo-lightbox-img" alt="">
    <p class="photo-lightbox-meta" id="photo-lightbox-meta"></p>
  </div>
</div>

<script src="api-config.js?v=systems-form-2"></script>
<script src="api-client.js?v=systems-form-2"></script>
<script src="auth.js?v=systems-form-2"></script>
<script src="nav.js?v=systems-form-2"></script>
<script src="photos-ui.js?v=systems-form-2"></script>
<script src="systems.js?v=systems-form-2"></script>
</body>
</html>
