<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - System Detail</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="systems">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>System Detail</h2>
        <p><a class="inline-link" href="systems.html">← Back to Systems</a></p>
      </div>
      <div id="user-profile-root"></div>
    </header>

    <section class="page-panel">
      <h3>Vista Springs – Domestic Hot Water</h3>
      <p class="detail-meta">
        <strong>Status:</strong> <span class="status-online">Online</span>
        &nbsp;|&nbsp; SiteID: <code>VS001</code>
        &nbsp;|&nbsp; Last update: <span id="system-last-update">Loading…</span>
      </p>
    </section>

    <section class="page-panel">
      <div class="panel-heading">
        <div>
          <h3>Temperature Trends</h3>
          <p>Supply (T1) and return (T2) from NOVARAReadings</p>
        </div>
        <div class="range-controls">
          <button class="range-btn" type="button" data-days="3">Last 3 Days</button>
          <button class="range-btn active" type="button" data-days="7">Last 7 Days</button>
          <button class="range-btn" type="button" data-days="30">Last 30 Days</button>
        </div>
      </div>
      <p id="chart-status" class="chart-status" aria-live="polite">Loading readings…</p>
      <div class="chart-wrap">
        <canvas id="temperature-trends-chart" aria-label="Temperature trends chart"></canvas>
      </div>
    </section>
  </main>
</div>

<script src="api-config.js"></script>
<script src="api-client.js"></script>
<script src="nav.js"></script>
<script src="temperature-trends.js"></script>
</body>
</html>
