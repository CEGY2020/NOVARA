<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - DHW Site Evaluation</title><link rel="stylesheet" href="dashboard.css?v=site-eval-2"></head>
<body data-page="leads" data-program="DHW"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><header class="topbar"><div><h2>DHW Site Evaluation</h2><p>Field intake for preliminary savings and project evaluation</p></div><div id="user-profile-root"></div></header>
<form id="eval-form" class="site-form"><div class="form-grid">
<label class="form-field"><span>Lead ID</span><input id="leadId" readonly></label><label class="form-field"><span>Property / Site *</span><input id="siteName" required></label><label class="form-field"><span>Site Address</span><input id="address"></label><label class="form-field"><span>City</span><input id="city"></label><label class="form-field"><span>State</span><input id="state" maxlength="2"></label><label class="form-field"><span>ZIP</span><input id="zip"></label>
<label class="form-field"><span>Building Type</span><select id="buildingType"><option value="">Select…</option><option>Multifamily</option><option>Hotel</option><option>Restaurant</option><option>School</option><option>Healthcare</option><option>Other</option></select></label><label class="form-field"><span>Units / Rooms Served</span><input id="units" type="number" min="0"></label>
<label class="form-field"><span>Number of DHW Systems</span><input id="systems" type="number" min="1"></label><label class="form-field"><span>Number of Water Heaters</span><input id="heaters" type="number" min="1"></label><label class="form-field"><span>Heater Manufacturer</span><input id="make"></label><label class="form-field"><span>Heater Model</span><input id="model"></label><label class="form-field"><span>Input Rating (BTU/hr each)</span><input id="btu" type="number" min="0"></label><label class="form-field"><span>Fuel</span><select id="fuel"><option>Natural Gas</option><option>Electric</option><option>Other</option></select></label>
<label class="form-field"><span>Storage Tank Capacity (gal)</span><input id="storage" type="number" min="0"></label><label class="form-field"><span>DHW Supply Temperature °F</span><input id="supply" type="number" step="0.1"></label><label class="form-field"><span>DHW Return Temperature °F</span><input id="returnTemp" type="number" step="0.1"></label><label class="form-field"><span>Recirculation Pumps</span><input id="pumps" type="number" min="0"></label><label class="form-field"><span>Recirc Configuration / Notes</span><input id="recirc"></label><label class="form-field"><span>Existing Controls</span><input id="controls"></label>
<label class="form-field"><span>Gas Utility</span><input id="utility" placeholder="e.g. SoCalGas"></label><label class="form-field"><span>Annual Gas Use (therms, if known)</span><input id="therms" type="number" min="0" step="any"></label><label class="form-field"><span>Annual Gas Cost (if known)</span><input id="gasCost" type="number" min="0" step="any"></label><label class="form-field"><span>Contractor</span><input id="contractor"></label><label class="form-field"><span>Estimated Project Cost</span><input id="projectCost" type="number" min="0" step="any"></label>
<label class="form-field form-field-wide"><span>Equipment / Nameplate Verification</span><textarea id="verification" rows="3" placeholder="Record make, model, serial, ratings and anything requiring verification"></textarea></label><label class="form-field form-field-wide"><span>Site Evaluation Notes</span><textarea id="notes" rows="4"></textarea></label>
</div><div class="modal-actions"><a class="secondary-btn" href="opportunities.html">Back to Opportunities</a><button type="button" class="secondary-btn" onclick="window.print()">Print / Save PDF</button><button type="submit" class="primary-btn">Save Evaluation</button></div><p id="status" class="chart-status" aria-live="polite"></p></form></main></div>
<script src="api-config.js?v=site-eval-2"></script><script src="auth.js?v=site-eval-2"></script><script src="api-client.js?v=site-eval-2"></script><script src="role.js?v=site-eval-2"></script><script src="nav.js?v=site-eval-2"></script><script src="site-evaluation.js?v=site-eval-2"></script></body></html>
