<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Installed</title><link rel="stylesheet" href="dashboard.css?v=installed-1"><style>.wrap{max-width:1050px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Installed</h2><p>Document what was actually installed in the field before commissioning</p></div><div id="user-profile-root"></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Scheduled Date<input id="scheduledDate" readonly></label><label>Installation Contractor<input id="contractorCompany" readonly></label><label>Assigned Crew<input id="assignedCrew" readonly></label></div></section><section class="card"><h3>Field Completion</h3><div class="grid"><label>Installation Status<select id="installationStatus"><option>In Progress</option><option>Installed - Punch List Open</option><option>Installed - Ready for Commissioning</option></select></label><label>Actual Installation Date<input id="actualInstallDate" type="date"></label><label>Lead Installer / Technician<input id="leadInstaller"></label><label>NOVARA Controller / Device ID<input id="controllerId"></label><label>Gateway / Cellular ID<input id="gatewayId"></label><label>Other Serial Numbers<input id="serialNumbers"></label><label class="check"><input id="equipmentInstalled" type="checkbox">Approved NOVARA equipment installed</label><label class="check"><input id="sensorsInstalled" type="checkbox">Required sensors installed</label><label class="check"><input id="wiringVerified" type="checkbox">Wiring / control connections verified</label><label class="check"><input id="powerVerified" type="checkbox">Power verified</label><label class="check"><input id="communicationsVerified" type="checkbox">Communications / cellular verified</label><label class="check"><input id="nameplatesCaptured" type="checkbox">Equipment nameplates documented</label><label class="check"><input id="photosCaptured" type="checkbox">Before / after installation photos documented</label><label class="check"><input id="siteRestored" type="checkbox">Site restored / cleanup complete</label><label class="check"><input id="installerSignedOff" type="checkbox">Installer completion sign-off received</label><label class="wide">Installed Equipment / Materials<textarea id="installedEquipment" rows="5"></textarea></label><label class="wide">Deviations / Change Orders / Field Conditions<textarea id="deviations" rows="4"></textarea></label><label class="wide">Punch List / Open Items<textarea id="punchList" rows="4"></textarea></label><label class="wide">Installation Notes<textarea id="installationNotes" rows="4"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backSchedule">Back to Installation Scheduled</a><button class="primary-btn" id="saveInstalled">Save Installed Stage</button><button class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="nextCommissioning">Next: Commissioning</a></div><p id="status"></p></sect
