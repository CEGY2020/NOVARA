<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Owner Home</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body data-page="owner-home" data-role="owner">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Owner Home</h2>
        <p>Your sites, performance, and savings</p>
      </div>
      <div id="user-profile-root"></div>
    </header>

    <section id="sites" class="page-panel">
      <h3>My Sites</h3>
      <p>Placeholder for sites associated with this owner account.</p>
    </section>

    <section id="performance" class="page-panel">
      <h3>Performance</h3>
      <p>Placeholder for site and system performance summaries.</p>
    </section>

    <section id="savings" class="page-panel">
      <h3>Savings</h3>
      <p>Placeholder for verified energy savings across your portfolio.</p>
    </section>
  </main>
</div>

<script src="role.js"></script>
<script src="nav.js"></script>
</body>
</html>
