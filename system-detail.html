<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - System Detail</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body data-page="systems">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>System Detail</h2>
        <p><a class="inline-link" href="systems.html">← Back to Systems</a></p>
      </div>
      <div id="user-profile-root"></div>
    </header>

    <section class="page-panel">
      <h3>Vista Springs – Domestic Hot Water</h3>
      <p class="detail-meta"><strong>Status:</strong> <span class="status-online">Online</span> &nbsp;|&nbsp; Last update: 2 minutes ago</p>
    </section>

    <section class="page-panel">
      <div class="panel-heading">
        <div>
          <h3>Temperature Trends</h3>
          <p>Historical performance for this system</p>
        </div>
        <div class="range-controls">
          <button class="range-btn" type="button" data-days="3">Last 3 Days</button>
          <button class="range-btn active" type="button" data-days="7">Last 7 Days</button>
          <button class="range-btn" type="button" data-days="30">Last 30 Days</button>
        </div>
      </div>
      <div class="graph-placeholder">
        Graph will go here
      </div>
    </section>
  </main>
</div>

<script src="nav.js"></script>
<script>
  document.querySelectorAll(".range-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".range-btn").forEach(function (b) {
        b.classList.remove("active");
      });
      btn.classList.add("active");
    });
  });
</script>
</body>
</html>
