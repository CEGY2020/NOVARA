AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NOVARA DynamoDB API for Amplify (/api/readings, /api/sites, /api/systems, /api/owners, /api/mgmt-companies)

Parameters:
  ReadingsTableName:
    Type: String
    Default: NOVARAReadings
  SitesTableName:
    Type: String
    Default: NOVARASites
  SystemsTableName:
    Type: String
    Default: NOVARASystems
  OwnersTableName:
    Type: String
    Default: NOVARAOwners
  MgmtCompaniesTableName:
    Type: String
    Default: NOVARAMgmtCompanies
  MaxChartPoints:
    Type: Number
    Default: 720

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:
  NovaraApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: novara-api
      Handler: lambda_function.handler
      CodeUri: .
      Description: NOVARA readings/sites/systems/owners/mgmt-companies JSON API backed by DynamoDB
      Environment:
        Variables:
          NOVARA_READINGS_TABLE: !Ref ReadingsTableName
          NOVARA_SITES_TABLE: !Ref SitesTableName
          NOVARA_SYSTEMS_TABLE: !Ref SystemsTableName
          NOVARA_OWNERS_TABLE: !Ref OwnersTableName
          NOVARA_MGMT_COMPANIES_TABLE: !Ref MgmtCompaniesTableName
          NOVARA_MAX_CHART_POINTS: !Ref MaxChartPoints
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:CreateTable
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReadingsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SitesTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SystemsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OwnersTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MgmtCompaniesTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReadingsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SitesTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SystemsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OwnersTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MgmtCompaniesTableName}/index/*
      Events:
        Readings:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/readings
            Method: GET
        SitesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: GET
        SitesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: POST
        SitesUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: PUT
        SystemsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: GET
        SystemsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: POST
        SystemsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: PUT
        OwnersGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: GET
        OwnersCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: POST
        OwnersUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: PUT
        OwnersUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners/{ownerId}
            Method: PUT
        MgmtCompaniesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: GET
        MgmtCompaniesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: POST
        MgmtCompaniesUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: PUT
        MgmtCompaniesUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies/{mgmtCompanyId}
            Method: PUT
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/health
            Method: GET
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /{proxy+}
            Method: ANY
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
            - PUT
          AllowHeaders:
            - content-type
          MaxAge: 86400

  NovaraHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        MaxAge: 86400

Outputs:
  HttpApiUrl:
    Description: API Gateway HTTP API base URL (use with Amplify /api rewrite)
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionUrl:
    Description: Lambda Function URL (CORS-enabled fallback when Amplify rewrite is unavailable)
    Value: !GetAtt NovaraApiFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref NovaraApiFunction
  ReadingsEndpoint:
    Description: Example readings endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/readings?siteId=VS001&days=7"
  SitesEndpoint:
    Description: Sites endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/sites"
  SystemsEndpoint:
    Description: Systems endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/systems"
  OwnersEndpoint:
    Description: Owners endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/owners"
  MgmtCompaniesEndpoint:
    Description: Management companies endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/mgmt-companies"
