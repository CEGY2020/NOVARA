<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOVARA - Sites</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef3f8;
}

header{
    background:#12385c;
    color:white;
    padding:20px 35px;
    font-size:28px;
}

.container{
    padding:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#1b4f7c;
    color:white;
    padding:15px;
    text-align:left;
}

td{
    padding:15px;
    border-bottom:1px solid #e5e5e5;
}

.status-online{
    color:green;
    font-weight:bold;
}

.status-warning{
    color:orange;
    font-weight:bold;
}

.status-offline{
    color:red;
    font-weight:bold;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#145ea8;
}

</style>

</head>

<body>

<header>
NOVARA Customer Sites
</header>

<div class="container">

<table>

<tr>
<th>Property</th>
<th>System</th>
<th>Status</th>
<th>Savings</th>
<th></th>
</tr>

<tr>
<td>Vista Springs</td>
<td>DHW System</td>
<td class="status-online">Online</td>
<td>34.2%</td>
<td><button>Open</button></td>
</tr>

<tr>
<td>Highlander Pointe</td>
<td>DHW System</td>
<td class="status-online">Online</td>
<td>31.8%</td>
<td><button>Open</button></td>
</tr>

<tr>
<td>La Verne Pool</td>
<td>Pool Heating</td>
<td class="status-warning">Needs Review</td>
<td>28.4%</td>
<td><button>Open</button></td>
</tr>

<tr>
<td>Solar Thermal Demo</td>
<td>Solar</td>
<td class="status-offline">Offline</td>
<td>--</td>
<td><button>Open</button></td>
</tr>

</table>

</div>

</body>
</html>
