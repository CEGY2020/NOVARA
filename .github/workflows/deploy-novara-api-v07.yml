name: Deploy NOVARA API v0.7

on:
  push:
    branches: [main]
    paths:
      - "scripts/deploy_novara_api_ci.py"
      - "lambda_function.py"
      - "novara_api.py"
      - "sales_reports.py"
      - "hubspot_crm.py"
      - "site_evaluations.py"
      - "summary_reports.py"
      - "workflow_documents.py"
      - "template.yaml"
      - ".github/workflows/deploy-novara-api-v07.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      NOVARA_AWS_REGION: ${{ vars.NOVARA_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
      NOVARA_API_STACK: ${{ vars.NOVARA_API_STACK || 'novara-api' }}
      NOVARA_READINGS_TABLE: ${{ vars.NOVARA_READINGS_TABLE || 'NOVARAReadings' }}
      NOVARA_SITES_TABLE: ${{ vars.NOVARA_SITES_TABLE || 'NOVARASites' }}
      NOVARA_SYSTEMS_TABLE: ${{ vars.NOVARA_SYSTEMS_TABLE || 'NOVARASystems' }}
      NOVARA_OWNERS_TABLE: ${{ vars.NOVARA_OWNERS_TABLE || 'NOVARAOwners' }}
      NOVARA_MGMT_COMPANIES_TABLE: ${{ vars.NOVARA_MGMT_COMPANIES_TABLE || 'NOVARAMgmtCompanies' }}
      NOVARA_LEADS_TABLE: ${{ vars.NOVARA_LEADS_TABLE || 'NOVARALeads' }}
      NOVARA_USERS_TABLE: ${{ vars.NOVARA_USERS_TABLE || 'NOVARAUsers' }}
      NOVARA_SETTINGS_TABLE: ${{ vars.NOVARA_SETTINGS_TABLE || 'NOVARASettings' }}
      NOVARA_UTILITY_BILLS_TABLE: ${{ vars.NOVARA_UTILITY_BILLS_TABLE || 'NOVARAUtilityBills' }}
      NOVARA_APP_BASE_URL: ${{ vars.NOVARA_APP_BASE_URL || 'https://cegy2020.github.io/NOVARA' }}
      AWS_APP_ID: ${{ vars.AWS_APP_ID || secrets.AWS_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt awscli aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.NOVARA_AWS_REGION }}

      - name: Deploy NOVARA API
        run: |
          python3 scripts/deploy_novara_api_ci.py
          git checkout -- api-config.js || true
