<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVARA Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="login-page">

    <section class="login-card">

        <img
            src="images/novara-logo.png"
            alt="NOVARA"
            class="logo"
        >

        <p class="subtitle">
            Operational Intelligence Platform
        </p>

        <p id="selectedRoleLabel" class="role-context" hidden></p>

        <p class="role-switch">
            <a href="directory.html">Create an account</a>
            ·
            <a href="index.html">Back to home</a>
        </p>

        <form id="loginForm">

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="name@company.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <div class="password-field">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="show-password"
                >
                    Show
                </button>

            </div>

            <div class="login-options">

                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">
                    Forgot password?
                </a>

            </div>

            <button type="submit" class="sign-in-button" id="loginSubmit">
                Sign In
            </button>

            <p id="loginMessage" class="login-message"></p>

        </form>

        <footer>
            <p>Powered by Advanced Energy Management</p>
            <p>© 2026 AEM. All rights reserved.</p>
        </footer>

    </section>

</main>

<script src="api-config.js"></script>
<script src="api-client.js"></script>
<script src="role.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>

</body>
</html>
