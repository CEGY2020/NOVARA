<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Contracted</title><link rel="stylesheet" href="dashboard.css?v=contracted-2"><style>.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Contracted</h2><p>Record the executed customer agreement and final commercial terms</p></div><div id="user-profile-root"></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Owner / Customer<input id="ownerName" readonly></label><label>Management Company<input id="mgmtName" readonly></label><label>Customer Approval<input id="approvalDecision" readonly></label></div></section><section class="card"><h3>Executed Agreement</h3><div class="grid"><label>Contract Status<select id="contractStatus"><option value="">Select…</option><option>Draft</option><option>Sent for Signature</option><option>Partially Executed</option><option>Fully Executed</option></select></label><label>Contract / Agreement #<input id="contractNumber"></label><label>Contract Date<input id="contractDate" type="date"></label><label>Executed By Customer<input id="customerSigner"></label><label>Customer Signer Title<input id="customerSignerTitle"></label><label>AEM Signer<input id="aemSigner"></label><label>AEM Signer Title<input id="aemSignerTitle"></label><label>Final Subscription Term (months)<input id="finalTerm" type="number" min="1"></label><label>Final Monthly Subscription ($)<input id="finalMonthly" type="number" min="0" step="any"></label><label>Final Installation / Project Price ($)<input id="finalProjectPrice" type="number" min="0" step="any"></label><label>Payment Terms<input id="paymentTerms"></label><label>Contract Document Reference<input id="contractReference"></label><label class="check"><input id="customerSigned" type="checkbox">Customer signature received</label><label class="check"><input id="aemSigned" type="checkbox">AEM signature received</label><label class="check"><input id="documentsComplete" type="checkbox">Executed documents complete</label><label class="wide">Final Scope / Commercial Notes<textarea id="contractNotes" rows="5"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backApproval">Back to Customer Approval</a><button class="primary-btn" id="saveContracted">Save Contracted Stage</button><button class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="nextInstall">Next: Installation Scheduled</a></div><p id="status"></p></section></div></main></div><script src="api-config.js?v=contracted-2"></script><script src="auth.js?v=contracted-2"></script><script src="api-client.js?v=contracted-2"></script><script src="role.js?v=contracted-2"></script><script src="nav.js?v=contracted-2"></script><script src="contracted.js?v=contracted-2"></script></body></html>
