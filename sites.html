<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVARA - Sites</title><link rel="stylesheet" href="dashboard.css?v=site-view-2"></head><body data-page="sites"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><header class="topbar"><div><h2>Sites</h2><p>Customer sites across the portfolio</p></div><div class="topbar-actions"><button type="button" class="primary-btn" id="add-site-btn">+ Add Site</button><div id="user-profile-root"></div></div></header><p id="sites-status" class="chart-status">Loading sites…</p><p id="sites-empty-state" class="chart-empty-state list-empty-state" hidden>No properties linked to your account yet</p><table class="data-table"><thead><tr><th>Site Name</th><th>Location</th><th>Owner</th><th>Owner ID</th><th>Systems</th><th>Status</th><th>Actions</th></tr></thead><tbody id="sites-tbody"><tr><td colspan="7">Loading…</td></tr></tbody></table></main></div><div class="modal-backdrop" id="site-modal" hidden><div class="modal-panel modal-panel-wide" role="dialog" aria-modal="true"><div class="modal-header"><div><h3 id="site-modal-title">Add Site</h3><p id="site-modal-subtitle">Create a new site in NOVARASites</p></div><button type="button" class="modal-close" id="site-modal-close">&times;</button></div><form id="site-form" class="site-form" novalidate><input type="hidden" id="site-mode" value="create"><div class="form-grid"><label class="form-field"><span>SiteID *</span><input id="field-siteId" required readonly><small id="site-id-hint">Auto-generated from existing sites</small></label><label class="form-field"><span>SiteName *</span><input id="field-siteName" required></label><label class="form-field"><span>Owner</span><select id="field-owner"><option value="">Select owner…</option></select></label><label class="form-field"><span>OwnerID</span><input id="field-ownerIdDisplay" readonly></label><label class="form-field"><span>MgmtCompany</span><select id="field-mgmtCompany"><option value="">Select company…</option></select></label><label class="form-field"><span>MgmtCompanyID</span><input id="field-mgmtCompanyIdDisplay" readonly></label><label class="form-field form-field-wide"><span>Address</span><input id="field-address"></label><label class="form-field"><span>City</span><input id="field-city"></label><label class="form-field"><span>State</span><input id="field-state"></label><label class="form-field"><span>Zip</span><input id="field-zip"></label><label class="form-field"><span>SystemType</span><select id="field-systemType"><option value="">Select…</option><option>DHW NG</option><option>DHW kW</option><option>DHW LP</option><option>Pool</option><option>HVAC</option></select></label><label class="form-field"><span>Status</span><select id="field-status"><option>Online</option><option>Offline</option><option>Needs Review</option></select><small id="site-status-hint"></small></label><label class="form-field"><span>Systems</span><input type="number" id="field-systems" value="0" readonly><small id="systems-count-hint"></small></label></div><section class="photos-section" id="photo-section"><p id="photo-status" hidden></p><p id="photo-empty">Save this site first to attach photos.</p><div id="photo-gallery"></div><div class="photo-upload-grid"><select id="photo-type"><option>Property</option><option>System</option><option>Equipment</option><option>Nameplate</option><option>Other</option></select><input id="photo-caption"><input type="file" id="photo-files" accept="image/*" multiple><button type="button" id="photo-upload-btn">Upload photos</button></div></section><p id="site-form-error" class="form-error" hidden></p><div class="modal-actions"><button type="button" class="secondary-btn" id="site-cancel-btn">Cancel</button><button type="button" class="secondary-btn" id="site-edit-btn" hidden>Edit</button><button type="submit" class="primary-btn" id="site-save-btn">Save</button></div></form></div></div><div class="photo-lightbox" id="photo-lightbox" hidden><div class="photo-lightbox-panel"><button id="photo-lightbox-close">&times;</button><img id="photo-lightbox-img" alt=""><p id="photo-lightbox-meta"></p></div></div><script src="api-config.js"></script><script src="api-client.js"></script><script src="role.js"></script><script src="auth.js"></script><script src="nav.js"></script><script src="photos-ui.js"></script><script src="sites.js?v=site-view-2"></script><script src="opportunity-return.js?v=1"></script></body></html>
