<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Sites</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body data-page="sites">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Sites</h2>
        <p>Customer sites across the portfolio</p>
      </div>
      <div id="user-profile-root"></div>
    </header>

    <p id="sites-status" class="chart-status" aria-live="polite">Loading sites…</p>

    <table class="data-table">
      <thead>
        <tr>
          <th>Site Name</th>
          <th>Location</th>
          <th>Systems</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="sites-tbody">
        <tr>
          <td colspan="4">Loading…</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<script src="nav.js"></script>
<script src="sites.js"></script>
</body>
</html>
