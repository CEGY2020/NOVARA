<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NOVARA - Pool Post-VSS</title><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="novara-ui-standard.css?v=1"><style>.vss-card{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:20px;margin-bottom:18px}.vss-card h3{margin:0 0 14px}.vss-grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:14px 20px}.vss-grid label{font-size:18px;font-weight:700;color:#000}.vss-grid input,.vss-grid select,.vss-grid textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;min-height:46px;font-size:18px;color:#000;padding:8px}.vss-wide{grid-column:1/-1}.vss-actions{display:flex;gap:12px;flex-wrap:wrap}.existing{background:#eef6fb}.status{font-size:17px;font-weight:700;color:#000}@media(max-width:800px){.vss-grid{grid-template-columns:1fr}}</style></head>
<body data-page="pool-post-vss"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><header class="topbar"><div><h2>Pool Post-VSS</h2><p>Enter information collected after the Virtual Site Survey</p></div><div id="user-profile-root"></div></header>
<section class="vss-card existing"><h3>Existing Lead / Site Information</h3><div class="vss-grid"><label>Lead<select id="leadId"><option value="">Select Lead</option></select></label><label>Site Name<input id="siteName" readonly></label><label>Company Name<input id="companyName" readonly></label><label>Contact Name<input id="contactName" readonly></label><label>Phone<input id="contactPhone" readonly></label><label>Email<input id="contactEmail" readonly></label><label>Management Company<input id="mgmtCompany" readonly></label><label>Site ID<input id="siteId" readonly></label></div></section>
<form id="vssForm"><section class="vss-card"><h3>VSS Information</h3><div class="vss-grid"><label>VSS Date<input type="date" id="vssDate"></label><label>VSS Completed By<input id="vssCompletedBy"></label><label>Pool Name / ID<input id="poolNameId"></label><label>Pool Type<input id="poolType"></label><label>Pool Length (ft)<input type="number" step="0.1" id="poolLengthFt"></label><label>Pool Width (ft)<input type="number" step="0.1" id="poolWidthFt"></label><label>Pool Surface Area (sq ft)<input type="number" step="0.1" id="poolSurfaceAreaSqFt"></label><label>Pool Volume (gallons)<input type="number" step="1" id="poolVolumeGallons"></label><label>Current Pool Setpoint (°F)<input type="number" step="0.1" id="currentPoolSetpointF"></label><label>Observed Pool Temp (°F)<input type="number" step="0.1" id="observedPoolTempF"></label><label>Normal Open Time<input type="time" id="poolOpenTime"></label><label>Normal Close Time<input type="time" id="poolCloseTime"></label><label>Operating Days<input id="operatingDays"></label><label>Existing Pool Control<input id="existingControl"></label></div></section>
<section class="vss-card"><h3>Existing Heater Information</h3><div class="vss-grid"><label>Heater Manufacturer<input id="heaterManufacturer"></label><label>Heater Model<input id="heaterModel"></label><label>Heater Quantity<input type="number" step="1" id="heaterQuantity"></label><label>BTU Input / Heater<input type="number" step="1" id="heaterBTUInput"></label><label>Total Connected BTU<input type="number" step="1" id="totalConnectedBTU"></label><label>Fuel<input id="fuel" value="Natural Gas"></label><label class="vss-wide">Heater / Equipment Notes<textarea id="heaterNotes" rows="3"></textarea></label></div></section>
<section class="vss-card"><h3>Review / Program Status</h3><div class="vss-grid"><label>VSS Status<select id="vssStatus"><option>Complete</option><option>Needs Information</option><option>Revisit</option></select></label><label>Program Eligibility<select id="programEligibility"><option>Pending</option><option>Eligible</option><option>Not Eligible</option></select></label><label>Customer Approval<select id="customerApprovalStatus"><option>Pending</option><option>Verbal Approval</option><option>Approved</option><option>Declined</option></select></label><label class="vss-wide">VSS Notes / Observations<textarea id="vssNotes" rows="5"></textarea></label></div></section><div class="vss-actions"><button class="primary-btn" type="submit">Save Post-VSS</button><button class="secondary-btn" type="button" id="printBtn">Print Form</button></div><p id="vssStatusMessage" class="status" aria-live="polite"></p></form></main></div><script src="api-config.js"></script><script src="auth.js"></script><script src="api-client.js"></script><script src="nav.js"></script><script src="pool-post-vss.js?v=1"></script></body></html>
