<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Customer Approval</title><link rel="stylesheet" href="dashboard.css?v=approval-1"><style>.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{border:1px solid #dfe5ec;border-radius:10px;padding:14px}.item b{display:block;margin-top:5px;font-size:20px}@media(max-width:800px){.grid,.summary{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Customer Approval</h2><p>Record the customer decision on the proposal</p></div><div id="user-profile-root"></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Owner / Customer<input id="ownerName" readonly></label><label>Management Company<input id="mgmtName" readonly></label><label>Proposal #<input id="proposalNumber" readonly></label></div></section><section class="card"><h3>Proposal Presented</h3><div class="summary"><div class="item">Subscription Term<b id="termSummary">—</b></div><div class="item">Monthly Subscription<b id="monthlySummary">—</b></div><div class="item">Project Price<b id="priceSummary">—</b></div><div class="item">Proposal Date<b id="proposalDateSummary">—</b></div></div></section><section class="card"><h3>Approval Decision</h3><div class="grid"><label>Decision<select id="decision"><option value="">Select…</option><option>Approved</option><option>Approved with Conditions</option><option>Changes Requested</option><option>Declined</option></select></label><label>Approval / Decision Date<input id="approvalDate" type="date"></label><label>Approved By<input id="approvedBy"></label><label>Approver Title<input id="approverTitle"></label><label>Approver Email<input id="approverEmail" type="email"></label><label>Proposal Version / Reference<input id="proposalVersion"></label><label>Approved Subscription Term (months)<input id="approvedTerm" type="number" min="1"></label><label>Approved Monthly Subscription ($)<input id="approvedMonthly" type="number" min="0" step="any"></label><label>Approved Installation / Project Price ($)<input id="approvedProjectPrice" type="number" min="0" step="any"></label><label class="wide">Conditions / Requested Changes<textarea id="conditions" rows="5"></textarea></label><label class="wide">Approval Notes<textarea id="approvalNotes" rows="4"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backProposal">Back to Proposal</a><button class="primary-btn" id="saveApproval">Save Customer Approval</button><button class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="nextContracted">Next: Contracted</a></div><p id="status"></p></section></div></main></div><script src="api-config.js?v=approval-1"></script><script src="auth.js?v=approval-1"></script><script src="api-client.js?v=approval-1"></script><script src="role.js?v=approval-1"></script><script src="nav.js?v=approval-1"></script><script src="customer-approval.js?v=approval-1"></script></body></html>
