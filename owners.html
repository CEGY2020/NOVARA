<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Owners</title>
  <link rel="stylesheet" href="dashboard.css?v=owners-delete-1">
</head>
<body data-page="owners">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Owners</h2>
        <p>Property owners and contacts</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="primary-btn" id="add-owner-btn" aria-haspopup="dialog">
          + Add Owner
        </button>
        <div id="user-profile-root"></div>
      </div>
    </header>

    <div class="view-tabs" role="tablist" aria-label="Owner status">
      <button type="button" class="view-tab is-active" role="tab" id="owners-filter-active" data-status="Active" aria-selected="true">
        Active
      </button>
      <button type="button" class="view-tab" role="tab" id="owners-filter-inactive" data-status="Inactive" aria-selected="false">
        Inactive
      </button>
    </div>

    <p id="owners-status" class="chart-status" aria-live="polite">Loading owners…</p>

    <table class="data-table">
      <thead>
        <tr>
          <th>Owner ID</th>
          <th>Name</th>
          <th>Location</th>
          <th>Contact</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="owners-tbody">
        <tr>
          <td colspan="7">Loading…</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<div class="modal-backdrop" id="owner-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="owner-modal-title">
    <div class="modal-header">
      <div>
        <h3 id="owner-modal-title">Add Owner</h3>
        <p id="owner-modal-subtitle">Create a new owner in NOVARAOwners</p>
      </div>
      <button type="button" class="modal-close" id="owner-modal-close" aria-label="Close">&times;</button>
    </div>

    <form id="owner-form" class="site-form" novalidate>
      <input type="hidden" id="owner-mode" value="create">

      <div class="form-grid">
        <label class="form-field">
          <span>OwnerID <em>*</em></span>
          <input type="text" id="field-ownerId" name="OwnerID" required maxlength="64" autocomplete="off" readonly aria-readonly="true">
          <small class="field-hint" id="owner-id-hint">Auto-generated sequentially (OWN001…)</small>
        </label>
        <label class="form-field">
          <span>Name <em>*</em></span>
          <input type="text" id="field-name" name="Name" required maxlength="120" autocomplete="organization">
        </label>
        <label class="form-field form-field-wide">
          <span>Address</span>
          <input type="text" id="field-address" name="Address" maxlength="200" autocomplete="street-address">
        </label>
        <label class="form-field">
          <span>City</span>
          <input type="text" id="field-city" name="City" maxlength="80" autocomplete="address-level2">
        </label>
        <label class="form-field">
          <span>State</span>
          <input type="text" id="field-state" name="State" maxlength="40" autocomplete="address-level1">
        </label>
        <label class="form-field">
          <span>Zip</span>
          <input type="text" id="field-zip" name="Zip" maxlength="20" autocomplete="postal-code">
        </label>
        <label class="form-field">
          <span>ContactName</span>
          <input type="text" id="field-contactName" name="ContactName" maxlength="120" autocomplete="name">
        </label>
        <label class="form-field">
          <span>ContactEmail</span>
          <input type="email" id="field-contactEmail" name="ContactEmail" maxlength="160" autocomplete="email">
        </label>
        <label class="form-field">
          <span>ContactPhone</span>
          <input type="tel" id="field-contactPhone" name="ContactPhone" maxlength="40" autocomplete="tel">
        </label>
        <label class="form-field form-field-wide">
          <span>Notes</span>
          <textarea id="field-notes" name="Notes" rows="3" maxlength="2000" placeholder="Optional notes"></textarea>
        </label>
      </div>

      <p id="owner-form-error" class="form-error" role="alert" hidden></p>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="owner-cancel-btn">Cancel</button>
        <button type="submit" class="primary-btn" id="owner-save-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="api-config.js?v=owners-delete-1"></script>
<script src="api-client.js?v=owners-delete-1"></script>
<script src="nav.js?v=owners-delete-1"></script>
<script src="phone-format.js?v=owners-delete-1"></script>
<script src="owners.js?v=owners-delete-1"></script>
</body>
</html>
