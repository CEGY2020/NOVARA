<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Pool Site Evaluation</title><link rel="stylesheet" href="dashboard.css?v=site-eval-3"></head>
<body data-page="leads" data-program="Pool"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><header class="topbar"><div><h2>Pool Site Evaluation</h2><p>Field intake for pool heating savings and project evaluation</p></div><div id="user-profile-root"></div></header>
<form id="eval-form" class="site-form"><div class="form-grid">
<label class="form-field"><span>Lead ID</span><input id="leadId" readonly></label><label class="form-field"><span>Property / Facility *</span><input id="siteName" required></label><label class="form-field"><span>Site Address</span><input id="address"></label><label class="form-field"><span>City</span><input id="city"></label><label class="form-field"><span>State</span><input id="state" maxlength="2"></label><label class="form-field"><span>ZIP</span><input id="zip"></label>
<label class="form-field"><span>Facility Type</span><select id="facilityType"><option value="">Select…</option><option>Multifamily</option><option>Hotel</option><option>Private School</option><option>YMCA</option><option>Swim School</option><option>Country Club</option><option>Municipal</option><option>Other</option></select></label><label class="form-field"><span>Number of Pools</span><input id="poolCount" type="number" min="1"></label><label class="form-field"><span>Pool Length (ft)</span><input id="length" type="number" min="0" step="any"></label><label class="form-field"><span>Pool Width (ft)</span><input id="width" type="number" min="0" step="any"></label><label class="form-field"><span>Average Depth (ft)</span><input id="depth" type="number" min="0" step="any"></label><label class="form-field"><span>Estimated Volume (gal)</span><input id="volume" type="number" min="0"></label>
<label class="form-field"><span>Pool Setpoint °F</span><input id="setpoint" type="number" step="0.1"></label><label class="form-field"><span>Operating Hours / Schedule</span><input id="schedule"></label><label class="form-field"><span>Pool Cover</span><select id="cover"><option value="">Select…</option><option>Yes</option><option>No</option><option>Sometimes</option></select></label><label class="form-field"><span>Outdoor / Indoor</span><select id="location"><option>Outdoor</option><option>Indoor</option></select></label>
<label class="form-field"><span>Number of Pool Heaters</span><input id="heaters" type="number" min="1"></label><label class="form-field"><span>Heater Manufacturer</span><input id="make"></label><label class="form-field"><span>Heater Model</span><input id="model"></label><label class="form-field"><span>Input Rating (BTU/hr each)</span><input id="btu" type="number" min="0"></label><label class="form-field"><span>Existing Controls</span><input id="controls"></label><label class="form-field"><span>Gas Utility</span><input id="utility" placeholder="e.g. SoCalGas"></label><label class="form-field"><span>Annual Gas Use (therms, if known)</span><input id="therms" type="number" min="0" step="any"></label><label class="form-field"><span>Annual Gas Cost (if known)</span><input id="gasCost" type="number" min="0" step="any"></label>
<label class="form-field"><span>Pool Service Contractor</span><input id="contractor"></label><label class="form-field"><span>Contractor Phone / Email</span><input id="contractorContact"></label><label class="form-field"><span>Estimated Installation Price</span><input id="installPrice" type="number" min="0" step="any"></label><label class="form-field form-field-wide"><span>Equipment / Nameplate Verification</span><textarea id="verification" rows="3" placeholder="Record make, model, serial and ratings"></textarea></label><label class="form-field form-field-wide"><span>Site Evaluation Notes</span><textarea id="notes" rows="4"></textarea></label>
</div><div class="modal-actions"><a class="secondary-btn" href="opportunities.html">Back to Opportunities</a><button type="button" class="secondary-btn" onclick="window.print()">Print / Save PDF</button><button type="submit" class="primary-btn">Save Evaluation</button><a class="secondary-btn" id="summary-link" href="summary-report.html">Open Summary Report</a></div><p id="status" class="chart-status" aria-live="polite"></p></form></main></div>
<script src="api-config.js?v=site-eval-3"></script><script src="auth.js?v=site-eval-3"></script><script src="api-client.js?v=site-eval-3"></script><script src="role.js?v=site-eval-3"></script><script src="nav.js?v=site-eval-3"></script><script src="site-evaluation.js?v=site-eval-3"></script></body></html>
