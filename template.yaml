AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NOVARA DynamoDB API for Amplify (/api/readings, /api/sites, /api/systems, /api/photos, /api/owners, /api/mgmt-companies, /api/leads, /api/users, /api/settings/utilityapi, /api/utility-bills)

Parameters:
  ReadingsTableName:
    Type: String
    Default: NOVARAReadings
  SitesTableName:
    Type: String
    Default: NOVARASites
  SystemsTableName:
    Type: String
    Default: NOVARASystems
  PhotosTableName:
    Type: String
    Default: NOVARAPhotos
  OwnersTableName:
    Type: String
    Default: NOVARAOwners
  MgmtCompaniesTableName:
    Type: String
    Default: NOVARAMgmtCompanies
  LeadsTableName:
    Type: String
    Default: NOVARALeads
  UsersTableName:
    Type: String
    Default: NOVARAUsers
  PreapprovedTableName:
    Type: String
    Default: NOVARAPreapprovedEmails
  SettingsTableName:
    Type: String
    Default: NOVARASettings
  UtilityBillsTableName:
    Type: String
    Default: NOVARAUtilityBills
  AdminAlertEmail:
    Type: String
    Default: steve@cegy.us
  SesFromEmail:
    Type: String
    Default: steve@cegy.us
  AppBaseUrl:
    Type: String
    Default: ""
  MaxChartPoints:
    Type: Number
    Default: 720

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64

Resources:
  NovaraPhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
              - Content-Type
            MaxAge: 3000

  NovaraApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: novara-api
      Handler: lambda_function.handler
      CodeUri: .
      Description: NOVARA readings/sites/systems/photos/owners/mgmt-companies/leads/users/settings/utility-bills JSON API backed by DynamoDB + S3
      Environment:
        Variables:
          NOVARA_READINGS_TABLE: !Ref ReadingsTableName
          NOVARA_SITES_TABLE: !Ref SitesTableName
          NOVARA_SYSTEMS_TABLE: !Ref SystemsTableName
          NOVARA_PHOTOS_TABLE: !Ref PhotosTableName
          NOVARA_PHOTOS_BUCKET: !Ref NovaraPhotosBucket
          NOVARA_OWNERS_TABLE: !Ref OwnersTableName
          NOVARA_MGMT_COMPANIES_TABLE: !Ref MgmtCompaniesTableName
          NOVARA_LEADS_TABLE: !Ref LeadsTableName
          NOVARA_USERS_TABLE: !Ref UsersTableName
          NOVARA_PREAPPROVED_TABLE: !Ref PreapprovedTableName
          NOVARA_SETTINGS_TABLE: !Ref SettingsTableName
          NOVARA_UTILITY_BILLS_TABLE: !Ref UtilityBillsTableName
          NOVARA_ADMIN_ALERT_EMAIL: !Ref AdminAlertEmail
          NOVARA_SES_FROM_EMAIL: !Ref SesFromEmail
          NOVARA_APP_BASE_URL: !Ref AppBaseUrl
          NOVARA_MAX_CHART_POINTS: !Ref MaxChartPoints
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchGetItem
                - dynamodb:DescribeTable
                - dynamodb:CreateTable
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReadingsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SitesTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SystemsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PhotosTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OwnersTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MgmtCompaniesTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeadsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreapprovedTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SettingsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UtilityBillsTableName}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReadingsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SitesTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SystemsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PhotosTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OwnersTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MgmtCompaniesTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeadsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${PreapprovedTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SettingsTableName}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UtilityBillsTableName}/index/*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:AbortMultipartUpload
              Resource:
                - !Sub ${NovaraPhotosBucket.Arn}/*
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource:
                - !GetAtt NovaraPhotosBucket.Arn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        Readings:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/readings
            Method: GET
        Savings:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/savings
            Method: GET
        SitesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: GET
        SitesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: POST
        SitesUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/sites
            Method: PUT
        SystemsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: GET
        SystemsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: POST
        SystemsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems
            Method: PUT
        SystemsUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems/{systemId}
            Method: PUT
        SystemsDeleteById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/systems/{systemId}
            Method: DELETE
        PhotosGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos
            Method: GET
        PhotosCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos
            Method: POST
        PhotosDeleteById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos/{photoId}
            Method: DELETE
        PhotosGetById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos/{photoId}
            Method: GET
        PhotosContent:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos/{photoId}/content
            Method: GET
        PhotosLocalUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/photos/upload/{proxy+}
            Method: PUT
        OwnersGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: GET
        OwnersCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: POST
        OwnersUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners
            Method: PUT
        OwnersUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/owners/{ownerId}
            Method: PUT
        MgmtCompaniesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: GET
        MgmtCompaniesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: POST
        MgmtCompaniesUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies
            Method: PUT
        MgmtCompaniesUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/mgmt-companies/{mgmtCompanyId}
            Method: PUT
        LeadsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/leads
            Method: GET
        LeadsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/leads
            Method: POST
        LeadsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/leads
            Method: PUT
        LeadsUpdateById:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/leads/{leadId}
            Method: PUT
        UsersGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users
            Method: GET
        UsersSignup:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/signup
            Method: POST
        UsersLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/login
            Method: POST
        UsersSignupAlias:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users
            Method: POST
        UsersSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/session
            Method: GET
        UsersStatusUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/{userId}/status
            Method: PUT
        UsersPreapprovedGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/preapproved
            Method: GET
        UsersPreapprovedAdd:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/preapproved
            Method: POST
        UsersPreapprovedRemove:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/users/preapproved/{email}
            Method: DELETE
        UtilityApiSettingsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/settings/utilityapi
            Method: GET
        UtilityApiSettingsPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/settings/utilityapi
            Method: PUT
        UtilityBillsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/utility-bills
            Method: GET
        UtilityBillsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/utility-bills
            Method: POST
        UtilityBillsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/utility-bills
            Method: PUT
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /api/health
            Method: GET
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref NovaraHttpApi
            Path: /{proxy+}
            Method: ANY
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - GET
            - POST
            - PUT
            - DELETE
          AllowHeaders:
            - content-type
            - authorization
          MaxAge: 86400

  NovaraHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 86400

Outputs:
  HttpApiUrl:
    Description: API Gateway HTTP API base URL (use with Amplify /api rewrite)
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionUrl:
    Description: Lambda Function URL (CORS-enabled fallback when Amplify rewrite is unavailable)
    Value: !GetAtt NovaraApiFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref NovaraApiFunction
  PhotosBucketName:
    Description: S3 bucket for site/system photos
    Value: !Ref NovaraPhotosBucket
  ReadingsEndpoint:
    Description: Example readings endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/readings?siteId=VS001&days=7"
  SavingsEndpoint:
    Description: Energy savings graphs endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/savings?days=30"
  SitesEndpoint:
    Description: Sites endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/sites"
  SystemsEndpoint:
    Description: Systems endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/systems"
  PhotosEndpoint:
    Description: Photos endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/photos"
  OwnersEndpoint:
    Description: Owners endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/owners"
  MgmtCompaniesEndpoint:
    Description: Management companies endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/mgmt-companies"
  LeadsEndpoint:
    Description: Leads endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/leads"
  UsersEndpoint:
    Description: Users endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/users"
  UtilityApiSettingsEndpoint:
    Description: UtilityAPI settings endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/settings/utilityapi"
  UtilityBillsEndpoint:
    Description: Utility bills endpoint
    Value: !Sub "https://${NovaraHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/utility-bills"
