<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Commissioning</title><link rel="stylesheet" href="dashboard.css?v=commissioning-1"><style>.wrap{max-width:1050px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Commissioning</h2><p>Verify NOVARA field operation, data, control and Optima ProLink readiness</p></div><div id="user-profile-root"></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Installation Date<input id="installDate" readonly></label><label>Controller / Device ID<input id="controllerId" readonly></label><label>Commissioning Date<input id="commissioningDate" type="date"></label></div></section><section class="card"><h3>Functional Commissioning</h3><div class="grid"><label>Commissioning Status<select id="commissioningStatus"><option>In Progress</option><option>Corrections Required</option><option>Passed - Ready for Optima ProLink</option></select></label><label>Commissioned By<input id="commissionedBy"></label><label>AEM Acceptance By<input id="acceptedBy"></label><label class="check"><input id="sensorValuesVerified" type="checkbox">Sensor values verified</label><label class="check"><input id="equipmentOperationVerified" type="checkbox">Equipment operation verified</label><label class="check"><input id="controlOutputsVerified" type="checkbox">Control outputs verified</label><label class="check"><input id="communicationsVerified" type="checkbox">Cloud / cellular communications verified</label><label class="check"><input id="dataFlowVerified" type="checkbox">Data received by Optima ProLink</label><label class="check"><input id="remoteControlVerified" type="checkbox">Authorized remote control verified</label><label class="check"><input id="alarmsVerified" type="checkbox">Alerts / alarms verified</label><label class="check"><input id="timeScheduleVerified" type="checkbox">Time / schedule settings verified</label><label class="check"><input id="baselineStarted" type="checkbox">Baseline / performance data collection started</label><label class="check"><input id="punchListClosed" type="checkbox">Installation punch list closed</label><label class="check"><input id="customerHandoffComplete" type="checkbox">Customer / site handoff completed</label><label class="check"><input id="aemAccepted" type="checkbox">AEM commissioning acceptance complete</label><label class="wide">Initial Setpoints / Control Strategy<textarea id="controlStrategy" rows="5"></textarea></label><label class="wide">Commissioning Corrections / Open Items<textarea id="corrections" rows="4"></textarea></label><label class="wide">Commissioning Notes<textarea id="commissioningNotes" rows="4"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backInstalled">Back to Installed</a><button class="primary-btn" id="saveCommissioning">Save Commissioning</button><button class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="nextActive">Next: Active Optima ProLink</a></div><p id="status"></p></section></div></main></div><script src="api-config.js?v=commissioning-1"></script><script src="auth.js?v=commissioning-1"></script><script src="api-client.js?v=commissioning-1"></script><script src="role.js?v=commissioning-1"></script><script src="nav.js?v=commissioning-1"></script><script src="commissioning.js?v=commissioning-1"></script></body></html>
