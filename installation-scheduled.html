<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - Installation Scheduled</title><link rel="stylesheet" href="dashboard.css?v=install-scheduled-1"><style>.wrap{max-width:1050px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Installation Scheduled</h2><p>Convert the executed project into a field-ready installation</p></div><div id="user-profile-root"></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Owner / Customer<input id="ownerName" readonly></label><label>Management Company<input id="mgmtName" readonly></label><label>Contract / Agreement #<input id="contractNumber" readonly></label></div></section><section class="card"><h3>Installation Schedule</h3><div class="grid"><label>Installation Status<select id="installationStatus"><option>Planning</option><option>Ready to Schedule</option><option>Scheduled</option><option>Reschedule Required</option><option>On Hold</option></select></label><label>Scheduled Date<input id="scheduledDate" type="date"></label><label>Scheduled Start Time<input id="scheduledTime" type="time"></label><label>Estimated Duration<input id="estimatedDuration" placeholder="e.g. 1 day"></label><label>Installation Contractor<input id="contractorCompany"></label><label>Assigned Technician / Crew<input id="assignedCrew"></label><label>Site Contact<input id="siteContact"></label><label>Site Contact Phone<input id="siteContactPhone"></label><label>Site Contact Email<input id="siteContactEmail" type="email"></label><label class="wide">Site Access / Parking / Entry Instructions<textarea id="accessInstructions" rows="4"></textarea></label></div></section><section class="card"><h3>Pre-Installation Readiness</h3><div class="grid"><label class="check"><input id="contractExecuted" type="checkbox">Customer agreement fully executed</label><label class="check"><input id="contractorAuthorized" type="checkbox">Contractor / Work Order authorized</label><label class="check"><input id="equipmentAvailable" type="checkbox">NOVARA equipment available</label><label class="check"><input id="materialsAvailable" type="checkbox">Installation materials available</label><label class="check"><input id="siteAccessConfirmed" type="checkbox">Site access confirmed</label><label class="check"><input id="shutdownApproved" type="checkbox">Required shutdown / service interruption approved</label><label class="check"><input id="permitsReady" type="checkbox">Required permits / approvals ready or not applicable</label><label class="check"><input id="utilityRequirementsReady" type="checkbox">Utility / program requirements ready or not applicable</label><label class="check"><input id="customerNotified" type="checkbox">Customer / management notified of schedule</label><label class="wide">Equipment / Materials / Special Requirements<textarea id="equipmentNotes" rows="4"></textarea></label><label class="wide">Installation Scope / Field Instructions<textarea id="fieldInstructions" rows="5"></textarea></label><label class="wide">Scheduling Notes<textarea id="scheduleNotes" rows="4"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backContracted">Back to Contracted</a><button class="primary-btn" id="saveSchedule">Save Installation Schedule</button><button class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="nextInstalled" href="opportunities.html">Next: Installed</a></div><p id="status"></p></section></div></main></div><script src="api-config.js?v=install-scheduled-1"></script><script src="auth.js?v=install-scheduled-1"></script><script src="api-client.js?v=install-scheduled-1"></script><script src="role.js?v=install-scheduled-1"></script><script src="nav.js?v=install-scheduled-1"></script><script src="installation-scheduled.js?v=install-scheduled-1"></script></body></html>
