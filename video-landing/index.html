<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA | Video Landing Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Served at /video-landing/ — assets live one level up at site root -->
  <link rel="stylesheet" href="../landing.css">
</head>
<body class="landing-page video-landing">

<main class="hero" id="top" aria-label="NOVARA video landing reference">
  <div class="hero-media" aria-hidden="true">
    <video
      id="hero-video"
      class="hero-video"
      src="../images/wave-video.mp4"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
      poster="../images/wave1.jpg"
    ></video>
    <div class="hero-veil hero-veil-light"></div>
  </div>

  <div class="hero-content">
    <img
      class="hero-brand-logo"
      src="../images/novara-logo-hero.png"
      alt="NOVARA"
    >
    <div class="hero-ctas">
      <a class="btn btn-primary" href="../directory.html">GET STARTED</a>
      <a class="btn btn-ghost" href="../login.html">LOG IN</a>
    </div>
  </div>
</main>

<script>
  (function () {
    var video = document.getElementById("hero-video");
    if (!video) return;
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute("muted", "");
    function tryPlay() {
      var playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(function () {});
      }
    }
    if (video.readyState >= 2) {
      tryPlay();
    } else {
      video.addEventListener("canplay", tryPlay, { once: true });
      video.addEventListener("loadeddata", tryPlay, { once: true });
    }
  })();
</script>

</body>
</html>
