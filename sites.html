<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVARA - Sites</title>
  <link rel="stylesheet" href="dashboard.css?v=photos-1">
</head>
<body data-page="sites">

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h2>Sites</h2>
        <p>Customer sites across the portfolio</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="primary-btn" id="add-site-btn" aria-haspopup="dialog">
          + Add Site
        </button>
        <div id="user-profile-root"></div>
      </div>
    </header>

    <p id="sites-status" class="chart-status" aria-live="polite">Loading sites…</p>

    <table class="data-table">
      <thead>
        <tr>
          <th>Site Name</th>
          <th>Location</th>
          <th>Systems</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="sites-tbody">
        <tr>
          <td colspan="5">Loading…</td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<div class="modal-backdrop" id="site-modal" hidden>
  <div class="modal-panel modal-panel-wide" role="dialog" aria-modal="true" aria-labelledby="site-modal-title">
    <div class="modal-header">
      <div>
        <h3 id="site-modal-title">Add Site</h3>
        <p id="site-modal-subtitle">Create a new site in NOVARASites</p>
      </div>
      <button type="button" class="modal-close" id="site-modal-close" aria-label="Close">&times;</button>
    </div>

    <form id="site-form" class="site-form" novalidate>
      <input type="hidden" id="site-mode" value="create">

      <div class="form-grid">
        <label class="form-field">
          <span>SiteID <em>*</em></span>
          <input type="text" id="field-siteId" name="SiteID" required maxlength="64" autocomplete="off" readonly aria-readonly="true">
          <small class="field-hint" id="site-id-hint">Auto-generated from existing sites</small>
        </label>
        <label class="form-field">
          <span>SiteName <em>*</em></span>
          <input type="text" id="field-siteName" name="SiteName" required maxlength="120" autocomplete="organization">
        </label>
        <label class="form-field">
          <span>Owner</span>
          <select id="field-owner" name="Owner">
            <option value="">Select owner…</option>
          </select>
        </label>
        <label class="form-field">
          <span>MgmtCompany</span>
          <select id="field-mgmtCompany" name="MgmtCompany">
            <option value="">Select company…</option>
          </select>
        </label>
        <label class="form-field form-field-wide">
          <span>Address</span>
          <input type="text" id="field-address" name="Address" maxlength="200">
        </label>
        <label class="form-field">
          <span>City</span>
          <input type="text" id="field-city" name="City" maxlength="80">
        </label>
        <label class="form-field">
          <span>State</span>
          <input type="text" id="field-state" name="State" maxlength="40">
        </label>
        <label class="form-field">
          <span>Zip</span>
          <input type="text" id="field-zip" name="Zip" maxlength="20">
        </label>
        <label class="form-field">
          <span>SystemType</span>
          <select id="field-systemType" name="SystemType">
            <option value="">Select…</option>
            <option value="DHW">DHW</option>
            <option value="Pool">Pool</option>
            <option value="HVAC">HVAC</option>
          </select>
        </label>
        <label class="form-field">
          <span>Status</span>
          <select id="field-status" name="Status">
            <option value="Online">Online</option>
            <option value="Offline">Offline</option>
            <option value="Needs Review">Needs Review</option>
          </select>
          <small class="field-hint" id="site-status-hint">Derived from linked systems when present</small>
        </label>
        <label class="form-field">
          <span>Systems</span>
          <input type="number" id="field-systems" name="Systems" min="0" step="1" value="0" readonly aria-readonly="true">
          <small class="field-hint" id="systems-count-hint">Live count of systems linked by SiteID in NOVARASystems</small>
        </label>
      </div>

      <section class="photos-section" id="photo-section" aria-label="Site photos">
        <div class="photos-section-header">
          <div>
            <h4>Photos</h4>
            <p>Property, equipment, and nameplate images for this site</p>
          </div>
        </div>
        <p id="photo-status" class="photo-status" role="status" hidden></p>
        <p id="photo-empty" class="photo-empty">Save this site first to attach photos.</p>
        <div id="photo-gallery" class="photo-gallery" aria-live="polite"></div>
        <div class="photo-upload-grid">
          <label class="form-field">
            <span>PhotoType</span>
            <select id="photo-type">
              <option value="Property">Property</option>
              <option value="System">System</option>
              <option value="Equipment">Equipment</option>
              <option value="Nameplate">Nameplate</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label class="form-field">
            <span>Caption</span>
            <input type="text" id="photo-caption" maxlength="500" placeholder="Optional caption">
          </label>
          <label class="form-field form-field-wide">
            <span>Images</span>
            <input type="file" id="photo-files" accept="image/*" multiple>
          </label>
          <div class="photo-upload-actions form-field-wide">
            <button type="button" class="secondary-btn" id="photo-upload-btn">Upload photos</button>
          </div>
        </div>
      </section>

      <p id="site-form-error" class="form-error" role="alert" hidden></p>

      <div class="modal-actions">
        <button type="button" class="secondary-btn" id="site-cancel-btn">Cancel</button>
        <button type="submit" class="primary-btn" id="site-save-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="photo-lightbox" id="photo-lightbox" hidden>
  <div class="photo-lightbox-panel" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button type="button" class="photo-lightbox-close" id="photo-lightbox-close" aria-label="Close">&times;</button>
    <img id="photo-lightbox-img" alt="">
    <p class="photo-lightbox-meta" id="photo-lightbox-meta"></p>
  </div>
</div>

<script src="api-config.js?v=photos-1"></script>
<script src="api-client.js?v=photos-1"></script>
<script src="auth.js?v=photos-1"></script>
<script src="nav.js?v=photos-1"></script>
<script src="photos-ui.js?v=photos-1"></script>
<script src="sites.js?v=photos-1"></script>
</body>
</html>
