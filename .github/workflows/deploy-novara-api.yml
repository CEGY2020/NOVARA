name: Deploy NOVARA API

# Deploys Lambda + API Gateway for /api/readings and /api/sites, then updates
# api-config.js so static hosts (Amplify / GitHub Pages) call real JSON APIs.

on:
  push:
    branches: [main]
    paths:
      - "template.yaml"
      - "lambda_function.py"
      - "novara_api.py"
      - "requirements.txt"
      - "scripts/deploy_novara_api.py"
      - "scripts/write_api_config.py"
      - "scripts/configure_amplify_api_rewrites.py"
      - ".github/workflows/deploy-novara-api.yml"
      - "amplify.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      NOVARA_AWS_REGION: ${{ vars.NOVARA_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
      NOVARA_API_STACK: ${{ vars.NOVARA_API_STACK || 'novara-api' }}
      NOVARA_READINGS_TABLE: ${{ vars.NOVARA_READINGS_TABLE || 'NOVARAReadings' }}
      NOVARA_SITES_TABLE: ${{ vars.NOVARA_SITES_TABLE || 'NOVARASites' }}
      NOVARA_SYSTEMS_TABLE: ${{ vars.NOVARA_SYSTEMS_TABLE || 'NOVARASystems' }}
      NOVARA_OWNERS_TABLE: ${{ vars.NOVARA_OWNERS_TABLE || 'NOVARAOwners' }}
      NOVARA_MGMT_COMPANIES_TABLE: ${{ vars.NOVARA_MGMT_COMPANIES_TABLE || 'NOVARAMgmtCompanies' }}
      NOVARA_LEADS_TABLE: ${{ vars.NOVARA_LEADS_TABLE || 'NOVARALeads' }}
      AWS_APP_ID: ${{ vars.AWS_APP_ID || secrets.AWS_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt awscli aws-sam-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.NOVARA_AWS_REGION }}

      # Long-term IAM access keys (AKIA...) reject session tokens. Drop placeholder
      # or short AWS_SESSION_TOKEN values before sam/aws calls.
      - name: Sanitize AWS session token for IAM user keys
        run: |
          python3 - <<'PY'
          import os
          access = (os.environ.get("AWS_ACCESS_KEY_ID") or "").strip()
          token = (os.environ.get("AWS_SESSION_TOKEN") or "").strip()
          if token and (access.startswith("AKIA") or len(token) < 100):
              github_env = os.environ["GITHUB_ENV"]
              with open(github_env, "a", encoding="utf-8") as fh:
                  fh.write("AWS_SESSION_TOKEN=\n")
              print("Cleared AWS_SESSION_TOKEN for IAM user key deploy")
          else:
              print("Kept AWS_SESSION_TOKEN as provided")
          PY

      - name: Deploy API + configure Amplify /api rewrite
        run: |
          python3 scripts/deploy_novara_api.py
          # Prefer Amplify same-origin /api rewrite over committing region-specific
          # API URLs into api-config.js.
          git checkout -- api-config.js || true
