version: 1
frontend:
  phases:
    preBuild:
      commands:
        - chmod +x scripts/amplify_prebuild_api.sh
        - ./scripts/amplify_prebuild_api.sh
    build:
      commands:
        - echo "NOVARA_API_BASE in api-config.js"
        - grep -n "NOVARA_API_BASE" api-config.js || true
        - |
          if ! grep -q 'src="formatDateTime.js' system-detail.html; then
            echo "ERROR system-detail.html must load formatDateTime.js"
            exit 1
          fi
          if ! grep -q 'id="add-site-btn"' sites.html; then
            echo "ERROR sites.html is missing add-site-btn"
            exit 1
          fi
          if ! grep -q 'id="site-modal"' sites.html; then
            echo "ERROR sites.html is missing site-modal"
            exit 1
          fi
          if ! grep -q 'id="add-system-btn"' systems.html; then
            echo "ERROR systems.html is missing add-system-btn"
            exit 1
          fi
          if ! grep -q 'id="system-modal"' systems.html; then
            echo "ERROR systems.html is missing system-modal"
            exit 1
          fi
          if ! grep -q 'id="add-owner-btn"' owners.html; then
            echo "ERROR owners.html is missing add-owner-btn"
            exit 1
          fi
          if ! grep -q 'id="owner-modal"' owners.html; then
            echo "ERROR owners.html is missing owner-modal"
            exit 1
          fi
          if ! grep -q 'id="add-mgmt-company-btn"' mgmt-companies.html; then
            echo "ERROR mgmt-companies.html is missing add-mgmt-company-btn"
            exit 1
          fi
          if ! grep -q 'id="mgmt-company-modal"' mgmt-companies.html; then
            echo "ERROR mgmt-companies.html is missing mgmt-company-modal"
            exit 1
          fi
          if ! grep -q 'id="add-lead-btn"' leads.html; then
            echo "ERROR leads.html is missing add-lead-btn"
            exit 1
          fi
          if ! grep -q 'id="lead-modal"' leads.html; then
            echo "ERROR leads.html is missing lead-modal"
            exit 1
          fi
          echo "Sites/Systems/Owners/Mgmt Companies/Leads Add buttons and modals present in build artifacts."
  artifacts:
    baseDirectory: .
    files:
      - "**/*"
  cache:
    paths: []
