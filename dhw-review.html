<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optima ProLink - DHW Review Portal</title><link rel="stylesheet" href="dashboard.css?v=dhw-review-1"><style>
.review-wrap{max-width:1180px;margin:0 auto;padding:18px}.review-status{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:18px;padding:14px;border:1px solid #cfd6dc;border-radius:8px;background:#fff}.review-status .form-field{min-width:190px}.review-section{margin:0 0 16px;padding:16px;border:1px solid #cfd6dc;border-radius:8px;background:#fff}.review-section h3{margin:0 0 10px;font:700 14pt Arial,sans-serif;color:#000}.review-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px 14px;margin-bottom:12px}.review-item{border-bottom:1px solid #eef1f3;padding:6px 0}.review-item strong{display:block;font:700 10pt Arial,sans-serif;color:#000}.review-item span{font:12pt Arial,sans-serif;color:#000;word-break:break-word}.review-controls{display:grid;grid-template-columns:220px 1fr;gap:12px;margin-top:12px}.review-controls textarea{min-height:70px}.review-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.status-pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef3f7;font:700 10pt Arial,sans-serif}.review-note{font:11pt Arial,sans-serif;color:#333;margin:0 0 14px}.empty{font-style:italic;color:#666}.heater-table{width:100%;border-collapse:collapse;margin:8px 0}.heater-table th,.heater-table td{border:1px solid #d8dde1;padding:6px;text-align:left;font:11pt Arial,sans-serif}.heater-table th{font-weight:700;background:#f5f7f8}@media(max-width:850px){.review-grid{grid-template-columns:1fr 1fr}.review-controls{grid-template-columns:1fr}}@media print{#sidebar-root,.topbar .review-actions,.review-actions,.review-status button{display:none!important}.dashboard-layout{display:block}.main-content{margin:0}.review-wrap{max-width:none;padding:0}.review-section,.review-status{break-inside:avoid}}
</style></head>
<body data-page="dhw-review" data-program="DHW"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><header class="topbar"><div><h2>DHW Review Portal</h2><p>Read-only site and system review with comments and approval</p></div><div id="user-profile-root"></div></header><div class="review-wrap">
<p class="review-note">Site information shown below is read-only. Review decisions and comments do not change the master DHW evaluation.</p>
<section class="review-status"><label class="form-field"><span>Lead ID</span><input id="leadId" readonly></label><label class="form-field"><span>Reviewer Name</span><input id="reviewerName"></label><label class="form-field"><span>Reviewer Company</span><input id="reviewerCompany"></label><label class="form-field"><span>Overall Review Status</span><select id="overallStatus"><option>Draft</option><option>Sent for Review</option><option>Changes Requested</option><option>Approved</option></select></label><label class="form-field"><span>Review Date</span><input id="reviewDate" type="date"></label><span class="status-pill" id="saveState">Not saved</span></section>
<div id="reviewSections"></div>
<div class="review-actions"><button type="button" class="primary-btn" id="saveReview">Save Review</button><button type="button" class="secondary-btn" onclick="window.print()">Print / Save PDF</button><a class="secondary-btn" id="backToEvaluation" href="dhw-site-evaluation.html">Back to DHW Evaluation</a></div>
<p id="status" class="chart-status" aria-live="polite"></p></div></main></div>
<script src="api-config.js?v=dhw-review-1"></script><script src="auth.js?v=dhw-review-1"></script><script src="api-client.js?v=dhw-review-1"></script><script src="role.js?v=dhw-review-1"></script><script src="nav.js?v=20261003-top"></script><script src="dhw-review.js?v=20261011-1"></script></body></html>
