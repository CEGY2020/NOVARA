version: 1
frontend:
  phases:
    preBuild:
      commands:
        - chmod +x scripts/amplify_prebuild_api.sh
        - ./scripts/amplify_prebuild_api.sh
    build:
      commands:
        - echo "NOVARA_API_BASE in api-config.js"
        - grep -n "NOVARA_API_BASE" api-config.js || true
        - |
          if ! grep -q 'id="add-site-btn"' sites.html; then
            echo "ERROR sites.html is missing add-site-btn"
            exit 1
          fi
          if ! grep -q 'id="site-modal"' sites.html; then
            echo "ERROR sites.html is missing site-modal"
            exit 1
          fi
          if ! grep -q 'id="add-system-btn"' systems.html; then
            echo "ERROR systems.html is missing add-system-btn"
            exit 1
          fi
          if ! grep -q 'id="system-modal"' systems.html; then
            echo "ERROR systems.html is missing system-modal"
            exit 1
          fi
          echo "Sites/Systems Add buttons and modals present in build artifacts."
  artifacts:
    baseDirectory: .
    files:
      - "**/*"
  cache:
    paths: []
