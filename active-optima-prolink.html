<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Optima ProLink</title><link rel="stylesheet" href="dashboard.css?v=active-1"><style>.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe5ec;border-radius:12px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.grid input,.grid select,.grid textarea{padding:10px;border:1px solid #cbd5df;border-radius:7px;font:inherit}.wide{grid-column:1/-1}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px!important}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body data-page="leads"><div class="dashboard-layout"><aside class="sidebar" id="sidebar-root"></aside><main class="main-content"><div class="wrap"><header class="topbar"><div><h2>Active Optima ProLink</h2><p>Activate the commissioned system for ongoing monitoring, analytics and optimization</p></div></header><section class="card"><div class="grid"><label>Lead ID<input id="leadId" readonly></label><label>Program<input id="program" readonly></label><label>Property / Site<input id="siteName" readonly></label><label>Controller / Device ID<input id="controllerId" readonly></label><label>Commissioning Status<input id="commissioningStatus" readonly></label><label>Activation Date<input id="activationDate" type="date"></label></div></section><section class="card"><h3>Service Activation</h3><div class="grid"><label>Optima ProLink Status<select id="serviceStatus"><option>Pending Activation</option><option>Active</option><option>Active - Baseline Period</option><option>Active - Optimization Enabled</option></select></label><label>Subscription Term (months)<input id="subscriptionTerm" type="number" min="1"></label><label>Monthly Subscription ($)<input id="monthlySubscription" type="number" min="0" step="any"></label><label class="check"><input id="dataLive" type="checkbox">Live data confirmed</label><label class="check"><input id="alertsEnabled" type="checkbox">Alerts / notifications enabled</label><label class="check"><input id="monitoringEnabled" type="checkbox">Remote monitoring enabled</label><label class="check"><input id="analyticsEnabled" type="checkbox">Analytics enabled</label><label class="check"><input id="optimizationEnabled" type="checkbox">Optimization enabled when approved</label><label class="check"><input id="customerAccessReady" type="checkbox">Customer access / reporting ready</label><label class="wide">Activation / Baseline / Optimization Notes<textarea id="activationNotes" rows="5"></textarea></label></div></section><section class="card"><div class="actions"><a class="secondary-btn" id="backCommissioning">Back to Commissioning</a><button class="primary-btn" id="saveActive">Save Active Optima ProLink</button><a class="secondary-btn" id="nextClosedWon">Next: Closed Won</a></div><p id="status"></p></section></div></main></div><script src="api-config.js?v=active-1"></script><script src="auth.js?v=active-1"></script><script src="api-client.js?v=active-1"></script><script src="role.js?v=active-1"></script><script src="nav.js?v=active-1"></script><script src="active-optima-prolink.js?v=active-1"></script></body></html>
