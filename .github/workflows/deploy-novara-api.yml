name: Deploy NOVARA API

# Deploys Lambda + API Gateway for /api/readings and /api/sites, then updates
# api-config.js so static hosts (Amplify / GitHub Pages) call real JSON APIs.

on:
  push:
    branches: [main]
    paths:
      - "template.yaml"
      - "lambda_function.py"
      - "novara_api.py"
      - "requirements.txt"
      - "scripts/deploy_novara_api.py"
      - "scripts/write_api_config.py"
      - "scripts/configure_amplify_api_rewrites.py"
      - ".github/workflows/deploy-novara-api.yml"
      - "amplify.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      NOVARA_AWS_REGION: ${{ vars.NOVARA_AWS_REGION || vars.AWS_REGION || 'us-west-2' }}
      NOVARA_API_STACK: ${{ vars.NOVARA_API_STACK || 'novara-api' }}
      NOVARA_READINGS_TABLE: ${{ vars.NOVARA_READINGS_TABLE || 'NOVARAReadings' }}
      NOVARA_SITES_TABLE: ${{ vars.NOVARA_SITES_TABLE || 'NOVARASites' }}
      NOVARA_SYSTEMS_TABLE: ${{ vars.NOVARA_SYSTEMS_TABLE || 'NOVARASystems' }}
      NOVARA_OWNERS_TABLE: ${{ vars.NOVARA_OWNERS_TABLE || 'NOVARAOwners' }}
      NOVARA_MGMT_COMPANIES_TABLE: ${{ vars.NOVARA_MGMT_COMPANIES_TABLE || 'NOVARAMgmtCompanies' }}
      NOVARA_LEADS_TABLE: ${{ vars.NOVARA_LEADS_TABLE || 'NOVARALeads' }}
      NOVARA_USERS_TABLE: ${{ vars.NOVARA_USERS_TABLE || 'NOVARAUsers' }}
      NOVARA_SETTINGS_TABLE: ${{ vars.NOVARA_SETTINGS_TABLE || 'NOVARASettings' }}
      NOVARA_UTILITY_BILLS_TABLE: ${{ vars.NOVARA_UTILITY_BILLS_TABLE || 'NOVARAUtilityBills' }}
      AWS_APP_ID: ${{ vars.AWS_APP_ID || secrets.AWS_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt awscli aws-sam-cli

      # Long-term IAM user keys (AKIA...) reject session tokens. Placeholder or
      # short AWS_SESSION_TOKEN secrets also break configure-aws-credentials
      # before any later sanitize step can run, so only pass a real STS token.
      - name: Resolve AWS session token
        id: aws_token
        env:
          RAW_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          access = (os.environ.get("RAW_ACCESS_KEY") or "").strip()
          token = (os.environ.get("RAW_SESSION_TOKEN") or "").strip()
          use_token = bool(token) and (not access.startswith("AKIA")) and len(token) >= 100
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"use_token={'true' if use_token else 'false'}\n")
          print(
              "Using AWS_SESSION_TOKEN for configure-aws-credentials"
              if use_token
              else "Omitting AWS_SESSION_TOKEN (IAM user key or placeholder/empty token)"
          )
          if not access:
              raise SystemExit(
                  "AWS_ACCESS_KEY_ID secret is empty. "
                  "Set repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY."
              )
          PY

      - name: Configure AWS credentials (IAM user key)
        if: steps.aws_token.outputs.use_token != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.NOVARA_AWS_REGION }}

      - name: Configure AWS credentials (temporary session)
        if: steps.aws_token.outputs.use_token == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.NOVARA_AWS_REGION }}

      - name: Deploy API + configure Amplify /api rewrite
        run: |
          python3 scripts/deploy_novara_api.py
          # Prefer Amplify same-origin /api rewrite over committing region-specific
          # API URLs into api-config.js.
          git checkout -- api-config.js || true
